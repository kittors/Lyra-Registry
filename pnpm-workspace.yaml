packages:
  - "packages/*"

allowBuilds:
  # Unpacks the workerd binary. It is what `wrangler dev` runs the Worker on locally, so without
  # this the platform can only be tested by deploying it.
  workerd: true
  # Fetches the platform-specific esbuild binary Vite builds the site with.
  esbuild: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260818.1'
