name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the only run whose answer anybody wants is
# the one for the current commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The site has to actually build; a type error in a component that nothing imports is still a
      # broken deploy, and `tsc --noEmit` does not run Vite's resolution.
      - name: Build the site
        run: pnpm build
