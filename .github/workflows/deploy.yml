name: Deploy

on:
  push:
    branches: [main]
  # Deploying is sometimes the thing you want without a commit — a rolled secret, a failed run.
  workflow_dispatch:

# Never two deploys at once, and never cancel one half-way: an interrupted `wrangler deploy` can
# leave the Worker and its migrations disagreeing about the schema.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A deploy that follows a failed CI run is a deploy of something known to be broken.
    needs: []
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build the site
        run: pnpm build

      # Migrations before the Worker: new code against an old schema fails, old code against a new
      # schema does not. The window between the two steps is therefore the safe direction.
      - name: Apply migrations
        run: pnpm db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the Worker
        run: pnpm --filter @lyra/registry-api deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
