<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Uses currentColor via a media query rather than a fixed fill, so the tab icon is legible
       against both a light and a dark browser chrome. -->
  <style>
    path, circle { stroke: #16181d; fill: #16181d; }
    @media (prefers-color-scheme: dark) { path, circle { stroke: #e8eaed; fill: #e8eaed; } }
    path { fill: none; }
  </style>
  <path d="M5 20V7.5C5 5 7 3 9.5 3S14 5 14 7.5V20M19 20V9.5C19 7.6 17.9 6 16 6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="9.5" cy="20.5" r="2"/>
  <circle cx="18.5" cy="20.5" r="1.6" opacity="0.55"/>
</svg>
