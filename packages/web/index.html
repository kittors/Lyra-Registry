<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Agent 市场 · 给 Claude Code、Codex、Pi、Lyra 装 skill 与 MCP 服务</title>
		<meta name="description" content="给 Claude Code、Codex、Pi、Lyra 装 skill、MCP 服务和插件。每个条目由平台从源码构建、校验哈希，装之前就知道它带了多少技能、能装进哪个客户端。" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<script>
			/*
			 * The theme is applied before the first paint.
			 *
			 * Doing it in React means one frame of the wrong colours on every load — a white flash on
			 * a dark screen, which is the single most noticeable way a site can feel unfinished.
			 */
			(() => {
				const saved = localStorage.getItem("lyra-theme");
				const theme = saved === "light" || saved === "dark" ? saved : null;
				if (theme) document.documentElement.dataset.theme = theme;
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
